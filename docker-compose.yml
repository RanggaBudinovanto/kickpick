# Reference compose file for running the backend + Postgres in containers.
# Not required for local development (see README.md for the native setup this
# repo has actually been tested against) — useful once Docker is available and
# for approximating the Railway/Fly.io deployment shape locally.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kickpick
      POSTGRES_PASSWORD: kickpick_dev_pw
      POSTGRES_DB: kickpick
    ports:
      - "5432:5432"
    volumes:
      - kickpick_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - kickpick_redis_data:/data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://kickpick:kickpick_dev_pw@postgres:5432/kickpick?sslmode=disable
      REDIS_URL: redis://redis:6379
      APP_ENV: production
      CORS_ALLOWED_ORIGIN: http://localhost:3000
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgresql://kickpick:kickpick_dev_pw@postgres:5432/kickpick?sslmode=disable
      REDIS_URL: redis://redis:6379
      APP_ENV: production
    depends_on:
      - postgres
      - redis

volumes:
  kickpick_postgres_data:
  kickpick_redis_data:
